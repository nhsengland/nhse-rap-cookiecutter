{% if cookiecutter.environment_manager == 'uv' %}{% set run = 'uv run ' %}{% else %}{% set run = '' %}{% endif -%}
# Check code style and linting on every push and pull request to main.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: {% if cookiecutter.linting_and_formatting == 'ruff' %}ruff{% else %}flake8 + black + isort{% endif %}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
{% if cookiecutter.environment_manager == 'conda' %}
      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: {{ cookiecutter.repo_name }}
          auto-activate-base: false
{% elif cookiecutter.environment_manager == 'uv' %}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras
{% else %}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version_number }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
{% endif %}
      - name: Run linters
        {% if cookiecutter.environment_manager == 'conda' %}shell: bash -el {0}
        {% endif %}run: |
{% if cookiecutter.linting_and_formatting == 'ruff' %}
          {{ run }}ruff check .
          {{ run }}ruff format --check .
{% else %}
          {{ run }}flake8 {{ cookiecutter.module_name }}
          {{ run }}isort --check --diff {{ cookiecutter.module_name }}
          {{ run }}black --check {{ cookiecutter.module_name }}
{% endif %}
