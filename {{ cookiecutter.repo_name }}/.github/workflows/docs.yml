# Build the MkDocs site and deploy it to GitHub Pages on every push to main.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to push the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  docs:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
{% if cookiecutter.environment_manager == 'conda' %}
      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: {{ cookiecutter.repo_name }}
          auto-activate-base: false

      - name: Build and deploy documentation
        shell: bash -el {0}
        run: mkdocs gh-deploy --force --clean
{% elif cookiecutter.environment_manager == 'uv' %}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --extra docs

      - name: Build and deploy documentation
        run: uv run mkdocs gh-deploy --force --clean
{% else %}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version_number }}"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build and deploy documentation
        run: mkdocs gh-deploy --force --clean
{% endif %}
