# Test configurations for the NHS DSA cookiecutter template.
# Each entry exercises a different combination of the (few) prompts.
# All values must match options in cookiecutter.json.

default_uv_mit:
  config_description: "Defaults: uv + MIT licence"
  project_name: "My First Project"
  author_name: "Test Author"
  description: "A first data science project."
  python_version_number: "3.11"
  environment_manager: "uv"
  open_source_license: "MIT"

pip_venv:
  config_description: "pip+venv environment manager"
