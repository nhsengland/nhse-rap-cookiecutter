[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nhs-dsa-cookiecutter"
version = "0.1.0"
description = "A lightweight, beginner-focused cookiecutter template for a first data-science project."
authors = [
  { name = "NHS England Data Science and Applied AI", email = "datascience@nhs.net" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10,<3.14"
dependencies = ["click", "cookiecutter"]

[project.scripts]
nhs-dsa-template = "nhs_dsa_cookiecutter.cli:main"

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "pytest-cookies", "ruff", "pyyaml"]

[project.urls]
"Source Code" = "https://github.com/nhsengland/nhs-dsa-cookiecutter"
"Bug Tracker" = "https://github.com/nhsengland/nhs-dsa-cookiecutter/issues"

[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = [
  "[{][{] cookiecutter.repo_name [}][}]",
  ".venv",
  "venv",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
